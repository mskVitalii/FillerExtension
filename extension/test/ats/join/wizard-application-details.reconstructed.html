<!doctype html>
<!--
  RECONSTRUCTED, not a live snapshot (see wizard-personal-information.reconstructed.html
  for why and what it is built from). This is the wizard's later step: cover letter
  upload, salary expectation, start availability (the wizard's own fixed options),
  a boolean screening question (Ja/Nein) and an integer one, and network links.
  Labels are the wizard's own strings: applicationWizard.coverLetter.title,
  ApplicationDetailsSummary.salaryExpectationSummaryLabel / startAvailability,
  StartAvailability.option*, screeningQuestions.boolean.*, integer.placeholder,
  ProfessionalLinks.*. The screening questions' wording is the employer's own and is
  illustrative here.
-->
<html><head><meta charset="utf-8"><title>join application details</title></head><body>
<div id="__next"><div class="css-1eoodx6"><div class="chakra-stack css-xjrqwy">
<form method="POST">
  <h3 class="chakra-heading css-wizard-title">Details zur Bewerbung</h3>
  <div class="chakra-stack css-3kyjg6">
    <div data-scope="field" data-part="root" id="position-coverLetter" role="group" class="chakra-field__root css-tvh8o1">
      <label data-scope="field" data-part="label" for="coverLetter" class="chakra-field__label css-1mq23c">Laden Sie Ihr Anschreiben hoch</label>
      <div data-scope="file-upload" data-part="dropzone" class="chakra-file-upload__dropzone css-drop">
        <input id="coverLetter" type="file" data-part="hidden-input" accept=".pdf,.doc,.docx" name="coverLetter" />
        <p>Datei hochladen</p>
        <p>Wählen Sie eine Datei aus oder ziehen Sie sie hierher.</p>
      </div>
    </div>
    <div data-scope="field" data-part="root" id="position-salaryExpectation" role="group" class="chakra-field__root css-tvh8o1">
      <label data-scope="field" data-part="label" for="salaryExpectation" class="chakra-field__label css-1mq23c">Wie hoch sind Ihre Gehaltsvorstellungen?</label>
      <div class="chakra-group css-1in9vqt">
        <input id="salaryExpectation" data-scope="field" data-part="input" type="text" inputmode="numeric" placeholder="Bitte geben Sie einen Betrag ein" class="chakra-input css-5oxtgl" name="salaryExpectation" />
        <span class="chakra-input__addon">€ / Jahr</span>
      </div>
    </div>
    <fieldset data-scope="radio-group" data-part="root" role="radiogroup" aria-labelledby="startAvailability-label" class="chakra-radio-group__root css-rg">
      <legend id="startAvailability-label" class="chakra-radio-group__label">Ab wann können Sie anfangen?</legend>
      <label class="chakra-radio-group__item"><input type="radio" name="startAvailability" value="IMMEDIATE" /><span>Sofort</span></label>
      <label class="chakra-radio-group__item"><input type="radio" name="startAvailability" value="TWO_WEEKS" /><span>Innerhalb von 2 Wochen</span></label>
      <label class="chakra-radio-group__item"><input type="radio" name="startAvailability" value="ONE_MONTH" /><span>Innerhalb von 1 Monat</span></label>
      <label class="chakra-radio-group__item"><input type="radio" name="startAvailability" value="TWO_MONTHS" /><span>Innerhalb von 2 Monaten</span></label>
      <label class="chakra-radio-group__item"><input type="radio" name="startAvailability" value="THREE_MONTHS" /><span>Innerhalb von 3 Monaten</span></label>
      <label class="chakra-radio-group__item"><input type="radio" name="startAvailability" value="MORE_THAN_THREE_MONTHS" /><span>Mehr als 3 Monate</span></label>
    </fieldset>
    <fieldset data-scope="radio-group" data-part="root" role="radiogroup" aria-labelledby="sq-1-label" class="chakra-radio-group__root css-rg">
      <legend id="sq-1-label" class="chakra-radio-group__label">Verfügen Sie über eine gültige Arbeitserlaubnis für Deutschland?</legend>
      <label class="chakra-radio-group__item"><input type="radio" name="screeningQuestions.0" value="true" /><span>Ja</span></label>
      <label class="chakra-radio-group__item"><input type="radio" name="screeningQuestions.0" value="false" /><span>Nein</span></label>
    </fieldset>
    <div data-scope="field" data-part="root" id="position-screeningQuestions.1" role="group" class="chakra-field__root css-tvh8o1">
      <label data-scope="field" data-part="label" for="screeningQuestions.1" class="chakra-field__label css-1mq23c">Wie viele Jahre Berufserfahrung haben Sie als Consultant?</label>
      <input id="screeningQuestions.1" data-scope="field" data-part="input" type="number" placeholder="Bitte geben Sie eine Zahl ein" class="chakra-input css-5oxtgl" name="screeningQuestions.1" />
    </div>
    <div data-scope="field" data-part="root" id="position-professionalLinks" role="group" class="chakra-field__root css-tvh8o1">
      <label data-scope="field" data-part="label" for="professionalLinks.0" class="chakra-field__label css-1mq23c">LinkedIn</label>
      <input id="professionalLinks.0" data-scope="field" data-part="input" type="url" placeholder="URL eingeben" class="chakra-input css-5oxtgl" name="professionalLinks.0" />
    </div>
    <button type="button" data-testid="ContinueButton" class="chakra-button css-1nwrsen"><span data-button-label="true">Weiter</span></button>
  </div>
</form>
</div></div></div>
</body></html>
