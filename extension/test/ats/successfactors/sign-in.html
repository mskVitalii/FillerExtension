<!doctype html>
<!--
  CAPTURED, then trimmed: SAP SuccessFactors Recruiting "Career Opportunities: Sign In"
  (public page, career5.successfactors.eu/career?company=SAP&loginFlowRequired=true,
  2026-11-18). Field ids/names/autocomplete as live; layout markup dropped.
-->
<html lang="en">
<body>
<form id="careerform" name="careerform" action="/career" method="POST" autocomplete="off">
  <input type="hidden" id="career_company" name="career_company" value="SAP">
  <h1>Career Opportunities: Sign In</h1>
  <label for="username">Email Address:<span>*</span></label>
  <input type="text" id="username" name="username" autocomplete="username" value="">
  <label for="password">Password:<span>*</span></label>
  <input type="password" id="password" name="password" autocomplete="current-password" value="">
  <input type="button" id="show_button" name="show_button" value="Show">
  <button type="submit">Sign In</button>
  <a href="#">Forgot your password?</a>
  <a href="#">Create an account</a>
</form>
</body>
</html>
